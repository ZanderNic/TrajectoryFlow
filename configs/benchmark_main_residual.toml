data_root = "data/processed/scifate2"
output_dir = "runs/main_benchmark_15h_to_20h"
seeds = [0, 1, 2]

fail_fast = true
save_checkpoints = true
save_predictions = true

[runtime]
device = "auto"
deterministic = true
precision = "float32"
store_cache_size = 0

[evaluation]
n_source_cells = 1000
n_target_cells = 1000
n_samples = 5
sample_batch_size = 1
prediction_warmup_runs = 0
prediction_timing_runs = 1

[evaluation.space]
transform = "none"

# ============================================================
# Model 1: no-change baseline
# ============================================================
[[models]]
name = "no_change"

# ============================================================
# Model 2: VelvetVAE + VelvetSDE
# ============================================================
[[models]]
name = "velvet"

[models.model_params]
hours_per_sde_unit = 2.0

[models.model_params.vae]
n_latent = 50
labelling_time = 2.0
stage1_epochs = 200
stage2_epochs = 800
n_neighbors = 100
gamma_init_cells = 5000
lr = 0.001
weight_decay = 0.001

[models.model_params.sde]
noise_scalar = 0.15
epochs = 250
cells_per_epoch = 200
simulations_per_cell = 50
n_steps = 30
markov_steps = 15
markov_neighbors = 10
t_max = 25.0
lr = 0.001

# ============================================================
# Model 3: full stochastic-residual dual-scale model
# ============================================================
[[models]]
name = "dual_scale_full"

[models.model_params]
latent_dim = 64
kinetic_dim = 32
use_kinetic_encoder = true
state_hidden_dims = [512, 256]
decoder_hidden_dims = [256, 512]
state_projection_dim = 128
kinetic_hidden_dims = [256, 128]
transition_noise_dim = 32
transition_hidden_dim = 256
transition_blocks = 2
initial_production = 0.1
initial_degradation = 0.1
max_degradation = 3.0
time_scale_hours = 5.0

[models.trainer_params]
local_batch_size = 128
global_batch_size = 128
labeling_time = 2.0
learning_rate = 0.001
weight_decay = 0.00001
global_samples = 1
sw_projections = 16

[models.trainer_params.schedule]
local_pretrain_epochs = 20
global_pretrain_epochs = 0
joint_epochs = 100
local_steps_per_pretrain_epoch = 100
global_steps_per_pretrain_epoch = 0
local_steps_per_joint_cycle = 2
global_steps_per_joint_cycle = 1
joint_cycles_per_epoch = 100

[models.trainer_params.loss_weights]
reconstruction = 1.0
local_kinetic = 1.0
population_sliced_wasserstein = 1.0

# ============================================================
# Main paper split
# ============================================================
[[splits]]
name = "extrapolation_15h_to_20h"
fit_timepoints = ["5h", "10h", "15h"]

[[splits.test_tasks]]
name = "15h_to_20h"
source = "15h"
target = "20h"
kind = "extrapolation"
