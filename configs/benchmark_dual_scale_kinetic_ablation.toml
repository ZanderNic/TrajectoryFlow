data_root = "data/processed/scifate2"
output_dir = "runs/dual_scale_kinetic_ablation"
seeds = [0, 1, 2]
fail_fast = true
save_checkpoints = true
save_predictions = true

[runtime]
device = "auto"
deterministic = true
precision = "float32"
store_cache_size = 0

[evaluation]
n_source_cells = 1000
n_target_cells = 1000
n_samples = 5
sample_batch_size = 1
prediction_warmup_runs = 0
prediction_timing_runs = 1

[evaluation.space]
transform = "none"

# ------------------------------------------------------------
# 2x2 factorial ablation
# Factor A: use_kinetic_encoder = false / true
# Factor B: local_kinetic loss weight = 0 / 1
# Reconstruction and population SW are identical in all runs.
# ------------------------------------------------------------

# A0 B0: no cell-specific kinetic branch, no local kinetic supervision.
[[models]]
name = "dual_scale_no_kin_no_local"

[models.model_params]
latent_dim = 64
kinetic_dim = 32
use_kinetic_encoder = false
state_hidden_dims = [512, 256]
decoder_hidden_dims = [256, 512]
state_projection_dim = 128
kinetic_hidden_dims = [256, 128]
transition_type = "diffusion"
transition_hidden_dims = [192, 192]
diffusion_time_embedding_dim = 32
diffusion_sample_steps = 8
diffusion_cosine_offset = 0.008
initial_production = 0.1
initial_degradation = 0.1
max_degradation = 3.0
time_scale_hours = 2.0

[models.trainer_params]
local_batch_size = 128
global_batch_size = 128
labeling_time = 2.0
learning_rate = 0.001
weight_decay = 0.00001
global_samples = 1
sw_projections = 16

[models.trainer_params.schedule]
local_pretrain_epochs = 20
global_pretrain_epochs = 0
joint_epochs = 100
local_steps_per_pretrain_epoch = 100
global_steps_per_pretrain_epoch = 0
local_steps_per_joint_cycle = 2
global_steps_per_joint_cycle = 1
joint_cycles_per_epoch = 100

[models.trainer_params.loss_weights]
reconstruction = 1.0
local_kinetic = 0.0
population_sliced_wasserstein = 1.0

# A1 B0: kinetic encoder present, but learned only through population SW.
[[models]]
name = "dual_scale_kin_no_local"

[models.model_params]
latent_dim = 64
kinetic_dim = 32
use_kinetic_encoder = true
state_hidden_dims = [512, 256]
decoder_hidden_dims = [256, 512]
state_projection_dim = 128
kinetic_hidden_dims = [256, 128]
transition_type = "diffusion"
transition_hidden_dims = [192, 192]
diffusion_time_embedding_dim = 32
diffusion_sample_steps = 8
diffusion_cosine_offset = 0.008
initial_production = 0.1
initial_degradation = 0.1
max_degradation = 3.0
time_scale_hours = 2.0

[models.trainer_params]
local_batch_size = 128
global_batch_size = 128
labeling_time = 2.0
learning_rate = 0.001
weight_decay = 0.00001
global_samples = 1
sw_projections = 16

[models.trainer_params.schedule]
local_pretrain_epochs = 20
global_pretrain_epochs = 0
joint_epochs = 100
local_steps_per_pretrain_epoch = 100
global_steps_per_pretrain_epoch = 0
local_steps_per_joint_cycle = 2
global_steps_per_joint_cycle = 1
joint_cycles_per_epoch = 100

[models.trainer_params.loss_weights]
reconstruction = 1.0
local_kinetic = 0.0
population_sliced_wasserstein = 1.0

# A0 B1: local kinetic objective exists, but without a cell-specific kinetic encoder.
# The alpha/gamma heads can only learn gene-wise baselines; this is a useful negative control.
[[models]]
name = "dual_scale_no_kin_local"

[models.model_params]
latent_dim = 64
kinetic_dim = 32
use_kinetic_encoder = false
state_hidden_dims = [512, 256]
decoder_hidden_dims = [256, 512]
state_projection_dim = 128
kinetic_hidden_dims = [256, 128]
transition_type = "diffusion"
transition_hidden_dims = [192, 192]
diffusion_time_embedding_dim = 32
diffusion_sample_steps = 8
diffusion_cosine_offset = 0.008
initial_production = 0.1
initial_degradation = 0.1
max_degradation = 3.0
time_scale_hours = 2.0

[models.trainer_params]
local_batch_size = 128
global_batch_size = 128
labeling_time = 2.0
learning_rate = 0.001
weight_decay = 0.00001
global_samples = 1
sw_projections = 16

[models.trainer_params.schedule]
local_pretrain_epochs = 20
global_pretrain_epochs = 0
joint_epochs = 100
local_steps_per_pretrain_epoch = 100
global_steps_per_pretrain_epoch = 0
local_steps_per_joint_cycle = 2
global_steps_per_joint_cycle = 1
joint_cycles_per_epoch = 100

[models.trainer_params.loss_weights]
reconstruction = 1.0
local_kinetic = 1.0
population_sliced_wasserstein = 1.0

# A1 B1: full three-objective model.
[[models]]
name = "dual_scale_full"

[models.model_params]
latent_dim = 64
kinetic_dim = 32
use_kinetic_encoder = true
state_hidden_dims = [512, 256]
decoder_hidden_dims = [256, 512]
state_projection_dim = 128
kinetic_hidden_dims = [256, 128]
transition_type = "diffusion"
transition_hidden_dims = [192, 192]
diffusion_time_embedding_dim = 32
diffusion_sample_steps = 8
diffusion_cosine_offset = 0.008
initial_production = 0.1
initial_degradation = 0.1
max_degradation = 3.0
time_scale_hours = 2.0

[models.trainer_params]
local_batch_size = 128
global_batch_size = 128
labeling_time = 2.0
learning_rate = 0.001
weight_decay = 0.00001
global_samples = 1
sw_projections = 16

[models.trainer_params.schedule]
local_pretrain_epochs = 20
global_pretrain_epochs = 0
joint_epochs = 100
local_steps_per_pretrain_epoch = 100
global_steps_per_pretrain_epoch = 0
local_steps_per_joint_cycle = 2
global_steps_per_joint_cycle = 1
joint_cycles_per_epoch = 100

[models.trainer_params.loss_weights]
reconstruction = 1.0
local_kinetic = 1.0
population_sliced_wasserstein = 1.0

[[splits]]
name = "extrapolation_15h_to_20h"
fit_timepoints = ["5h", "10h", "15h"]

[[splits.test_tasks]]
name = "15h_to_20h"
source = "15h"
target = "20h"
kind = "extrapolation"
