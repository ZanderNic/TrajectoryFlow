data_root = "data/processed/scifate2"
output_dir = "runs/velvet_paper_direction_example"
seeds = [0]
fail_fast = true
save_checkpoints = false
save_predictions = false

[runtime]
device = "auto"
deterministic = true
precision = "float32"
allow_tf32 = false
cudnn_benchmark = false

[evaluation]
n_source_cells = 1000
n_target_cells = 1000
n_samples = 1
prediction_warmup_runs = 0
prediction_timing_runs = 1

[evaluation.velocity]
enabled = true
reference_dir = "data/processed/scifate2/velocity_references"
plots = true
plot_max_cells = 10000
plot_max_arrows = 500
cell_id_column = "cell_id"
color_by = "cell_type"

[[models]]
name = "velvet"

[models.model_params]
# Required by the wrapper even though it is irrelevant for local velocity scores.
hours_per_sde_unit = 2.0

[models.model_params.vae]
n_latent = 50
stage1_epochs = 200
stage2_epochs = 800
labelling_time = 2.0
lr = 0.001
weight_decay = 0.001
n_neighbors = 100

[models.trainer_params]
train_sde = false

[[splits]]
name = "paper_direction_all_cells"
fit_timepoints = ["5h", "10h", "15h", "20h", "72h", "96h", "120h", "144h", "168h", "192h"]

[splits.cell_split]
train_fraction = 1.0
validation_fraction = 0.0
test_fraction = 0.0

[[splits.test_velocity_tasks]]
name = "pts"
reference = "pts"
timepoints = ["5h", "10h", "15h", "20h", "72h", "96h", "120h", "144h", "168h", "192h"]
partition = "all"

[[splits.test_velocity_tasks]]
name = "crs"
reference = "crs"
timepoints = ["5h", "10h", "15h", "20h", "72h", "96h", "120h", "144h", "168h", "192h"]
partition = "all"
